<svg
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc">

  <title id="title">Kartoffelmachine - Sistema inteligente de inspeccion de papas</title>
  <desc id="desc">Animacion SVG de una faja transportadora con papas, camara de escaneo y clasificacion de papa buena o mala.</desc>

  <defs>
    <!-- Fondo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03130c"/>
      <stop offset="45%" stop-color="#06271a"/>
      <stop offset="100%" stop-color="#03130c"/>
    </linearGradient>

    <!-- Papa buena -->
    <radialGradient id="potato" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#f5d987"/>
      <stop offset="60%" stop-color="#c99b45"/>
      <stop offset="100%" stop-color="#8a642d"/>
    </radialGradient>

    <!-- Papa mala -->
    <radialGradient id="badPotato">
      <stop offset="0%" stop-color="#b98a49"/>
      <stop offset="70%" stop-color="#76552c"/>
      <stop offset="100%" stop-color="#3d2818"/>
    </radialGradient>

    <!-- Glow verde -->
    <filter id="greenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow rojo -->
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linea scanner -->
    <linearGradient id="scanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="520" fill="url(#bg)"/>

  <!-- Grid futurista -->
  <g opacity="0.16" stroke="#39ff88" stroke-width="1">
    <path d="M0 65 H1200"/>
    <path d="M0 130 H1200"/>
    <path d="M0 195 H1200"/>
    <path d="M0 260 H1200"/>
    <path d="M0 325 H1200"/>
    <path d="M0 390 H1200"/>
    <path d="M0 455 H1200"/>

    <path d="M100 0 V520"/>
    <path d="M300 0 V520"/>
    <path d="M500 0 V520"/>
    <path d="M700 0 V520"/>
    <path d="M900 0 V520"/>
    <path d="M1100 0 V520"/>
  </g>

  <!-- Titulo: arriba de la camara, con espacio propio -->
  <g id="titulo">
    <text
      x="600"
      y="72"
      text-anchor="middle"
      fill="#eafff1"
      font-family="Arial, sans-serif"
      font-size="58"
      font-weight="900"
      letter-spacing="5"
      filter="url(#greenGlow)">
      KARTOFFELMACHINE
    </text>

    <text
      x="600"
      y="122"
      text-anchor="middle"
      fill="#6cff9e"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="700"
      letter-spacing="2">
      SISTEMA INTELIGENTE DE INSPECCION DE PAPAS
    </text>
  </g>

  <!-- Separador visual entre encabezado y escaner -->
  <g opacity="0.55">
    <path
      d="M360 150 H840"
      stroke="#39ff88"
      stroke-width="2"
      stroke-linecap="round"
      filter="url(#greenGlow)"/>
    <circle cx="600" cy="150" r="4" fill="#39ff88" filter="url(#greenGlow)"/>
  </g>

  <!-- Camara / escaner: debajo del titulo, sin superposicion -->
  <g id="camara">
    <rect
      x="545"
      y="178"
      width="110"
      height="45"
      rx="8"
      fill="#081b12"
      stroke="#39ff88"
      stroke-width="3"/>

    <circle
      cx="600"
      cy="201"
      r="14"
      fill="#020806"
      stroke="#39ff88"
      stroke-width="3"/>

    <circle
      cx="600"
      cy="201"
      r="6"
      fill="#39ff88"
      filter="url(#greenGlow)"/>

    <path
      d="M575 222 L480 420 L720 420 L625 222 Z"
      fill="#39ff88"
      opacity="0.06"
      stroke="#39ff88"
      stroke-width="1"/>

    <rect
      x="485"
      y="255"
      width="230"
      height="5"
      fill="url(#scanner)"
      filter="url(#greenGlow)">
      <animate
        attributeName="y"
        values="255;405;255"
        dur="1.8s"
        repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Faja transportadora -->
  <g id="faja">
    <rect
      x="90"
      y="430"
      width="1020"
      height="25"
      rx="10"
      fill="#132c22"
      stroke="#39ff88"
      stroke-width="2"/>

    <g stroke="#39ff88" stroke-width="4" opacity="0.6">
      <path d="M120 440 l25 0"/>
      <path d="M190 440 l25 0"/>
      <path d="M260 440 l25 0"/>
      <path d="M330 440 l25 0"/>
      <path d="M400 440 l25 0"/>
      <path d="M470 440 l25 0"/>
      <path d="M540 440 l25 0"/>
      <path d="M610 440 l25 0"/>
      <path d="M680 440 l25 0"/>
      <path d="M750 440 l25 0"/>
      <path d="M820 440 l25 0"/>
      <path d="M890 440 l25 0"/>
      <path d="M960 440 l25 0"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        from="-70 0"
        to="0 0"
        dur="1s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Papa buena -->
  <g id="papa-buena">
    <path
      d="M-80 360
         C-100 320 -75 280 -35 275
         C10 270 30 300 26 345
         C22 388 -5 410 -45 400
         C-68 395 -72 380 -80 360 Z"
      fill="url(#potato)"
      stroke="#e4ba65"
      stroke-width="3">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;630 0;630 0;1250 0"
        keyTimes="0;0.28;0.52;1"
        dur="12s"
        repeatCount="indefinite"/>
    </path>

    <g fill="#72512b">
      <circle cx="-45" cy="310" r="4"/>
      <circle cx="-20" cy="355" r="5"/>
      <circle cx="-60" cy="370" r="3"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;630 0;630 0;1250 0"
        keyTimes="0;0.28;0.52;1"
        dur="12s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Texto escaneando -->
  <text
    x="600"
    y="495"
    text-anchor="middle"
    fill="#39ff88"
    font-family="monospace"
    font-size="18"
    font-weight="bold"
    filter="url(#greenGlow)">
    ANALIZANDO SUPERFICIE...
    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0;1;1;0"
      keyTimes="0;0.23;0.27;0.42;0.46;0.60;0.65;0.80;1"
      dur="12s"
      repeatCount="indefinite"/>
  </text>

  <!-- Resultado papa buena -->
  <g id="resultado-buena">
    <circle
      cx="980"
      cy="255"
      r="36"
      fill="#062d18"
      stroke="#39ff88"
      stroke-width="4"
      filter="url(#greenGlow)"/>

    <path
      d="M960 255 L975 270 L1002 236"
      fill="none"
      stroke="#39ff88"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <text
      x="980"
      y="315"
      text-anchor="middle"
      fill="#39ff88"
      font-family="Arial, sans-serif"
      font-size="27"
      font-weight="bold">
      PAPA BUENA
    </text>

    <animate
      attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.38;0.42;0.52;0.57;1"
      dur="12s"
      repeatCount="indefinite"/>
  </g>

  <!-- Papa mala -->
  <g id="papa-mala">
    <path
      d="M-80 360
         C-100 320 -75 280 -35 275
         C10 270 30 300 26 345
         C22 388 -5 410 -45 400
         C-68 395 -72 380 -80 360 Z"
      fill="url(#badPotato)"
      stroke="#a86c35"
      stroke-width="3">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="-200 0;-200 0;630 0;630 0;1250 0"
        keyTimes="0;0.50;0.66;0.82;1"
        dur="12s"
        repeatCount="indefinite"/>
    </path>

    <g fill="#301811">
      <circle cx="-50" cy="315" r="13"/>
      <circle cx="-15" cy="355" r="10"/>
      <circle cx="-55" cy="375" r="7"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="-200 0;-200 0;630 0;630 0;1250 0"
        keyTimes="0;0.50;0.66;0.82;1"
        dur="12s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Resultado papa mala -->
  <g id="resultado-mala">
    <circle
      cx="980"
      cy="365"
      r="36"
      fill="#310909"
      stroke="#ff4545"
      stroke-width="4"
      filter="url(#redGlow)"/>

    <path
      d="M963 348 L997 382 M997 348 L963 382"
      stroke="#ff4545"
      stroke-width="8"
      stroke-linecap="round"/>

    <text
      x="980"
      y="425"
      text-anchor="middle"
      fill="#ff4545"
      font-family="Arial, sans-serif"
      font-size="27"
      font-weight="bold">
      PAPA MALA
    </text>

    <animate
      attributeName="opacity"
      values="0;0;1;1;0"
      keyTimes="0;0.78;0.82;0.94;1"
      dur="12s"
      repeatCount="indefinite"/>
  </g>

  <!-- Texto esquina -->
  <text
    x="30"
    y="495"
    fill="#39ff88"
    opacity="0.55"
    font-size="13"
    font-family="monospace">
    AI VISION SYSTEM // KARTOFFELMACHINE
  </text>
</svg>
